<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=@landing.first">
<link rel="canonical" href="@landing.first">
<link rel="manifest" href="@landing.base/manifest.webmanifest">
<meta name="theme-color" content="#0b1230">
<meta name="description" content="The V Programming Language Book: a complete guide to V, with every code example compiled and run.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="@landing.site_name">
<meta property="og:title" content="@landing.site_name">
<meta property="og:description" content="A complete guide to the V programming language, in 16 languages.">
<meta property="og:url" content="@landing.first">
<meta property="og:image" content="@landing.base/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="@landing.site_name">
<meta name="twitter:image" content="@landing.base/og-image.png">
<link rel="icon" href="@landing.base/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="@landing.base/icon-192.png">
<title>@landing.site_name</title>
<link rel="stylesheet" href="@landing.base/app.css">
</head>
<body class="landing">
<div class="landing-card">
<img class="landing-logo" src="@landing.base/logo.svg" alt="" width="72" height="72">
<h1 class="landing-title">@landing.site_name</h1>
<p class="landing-text">The book opens in a moment. If it does not, <a href="@landing.first">open the first page</a>.</p>
<nav class="landing-langs">@landing.langs</nav>
</div>
</body>
</html>
