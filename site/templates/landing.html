<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=@landing.first">
<link rel="canonical" href="@landing.first">
<link rel="icon" href="@landing.base/logo.svg" type="image/svg+xml">
<title>@landing.site_name</title>
<link rel="stylesheet" href="@landing.base/app.css">
</head>
<body class="landing">
<div class="landing-card">
<img class="landing-logo" src="@landing.base/logo.svg" alt="" width="72" height="72">
<h1 class="landing-title">@landing.site_name</h1>
<p class="landing-text">The book opens in a moment. If it does not, <a href="@landing.first">open the first page</a>.</p>
<nav class="landing-langs">@landing.langs</nav>
</div>
</body>
</html>
