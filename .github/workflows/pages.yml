name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        run: |
          # Built from source, because the site generator uses the current
          # `$tmpl` API and veb's static compression, both of which landed
          # after the 0.5.2 release binary.
          sudo apt-get update -qq
          sudo apt-get install -y make git
          git clone --depth=1 https://github.com/vlang/v /tmp/v
          cd /tmp/v && make
          echo "/tmp/v" >> $GITHUB_PATH
          /tmp/v/v version

      - name: Build the static site
        run: |
          v run site

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
