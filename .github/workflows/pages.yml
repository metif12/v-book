name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        run: |
          curl -sSL https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip -o v.zip
          unzip -o v.zip -d /usr/local/bin
          chmod +x /usr/local/bin/v/v
          echo "/usr/local/bin/v" >> $GITHUB_PATH
          /usr/local/bin/v/v version

      - name: Build the static site
        run: |
          v run site

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
