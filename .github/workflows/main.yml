name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code:
    name: Test V Code Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        run: |
          curl -sSL https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip -o v.zip
          unzip -o v.zip -d /usr/local/bin
          chmod +x /usr/local/bin/v/v
          echo "/usr/local/bin/v" >> $GITHUB_PATH

      - name: Compile and run every code block
        run: |
          v run tools/code_test.vsh

      - name: Check the site builder
        run: |
          v -check site

      - name: Build the site
        run: |
          v run site

      - name: Validate book structure
        run: |
          v run tools/validate.vsh

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
