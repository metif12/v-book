name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code:
    name: Test V Code Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        run: |
          # The site builder uses the current `$tmpl` API and veb's static
          # compression, both of which landed after the 0.5.2 release binary.
          sudo apt-get update -qq
          sudo apt-get install -y make git
          git clone --depth=1 https://github.com/vlang/v /tmp/v
          cd /tmp/v && make
          echo "/tmp/v" >> $GITHUB_PATH
          /tmp/v/v version

      - name: Compile and run every code block
        run: |
          v run tools/code_check.vsh

      - name: Check the site builder
        run: |
          v -check site

      - name: Build the site
        run: |
          v run site

      - name: Validate book structure
        run: |
          v run tools/validate.vsh

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
