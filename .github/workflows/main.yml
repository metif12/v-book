name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MDBOOK_VERSION: "0.4.40"
  V_VERSION: "0.5.2"

jobs:
  test:
    name: Test Code Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        run: |
          curl -sSL https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip -o v.zip
          unzip -o v.zip -d /usr/local/bin
          chmod +x /usr/local/bin/v/v
          ln -sf /usr/local/bin/v/v /usr/local/bin/vc

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v${{ env.MDBOOK_VERSION }}/mdbook-v${{ env.MDBOOK_VERSION }}-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin

      - name: Test V code blocks
        run: |
          /usr/local/bin/v/v run tools/mdbook-v-test .

      - name: Build book
        run: mdbook build

  lint:
    name: Lint and Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        run: |
          curl -sSL https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip -o v.zip
          unzip -o v.zip -d /usr/local/bin
          chmod +x /usr/local/bin/v/v
          ln -sf /usr/local/bin/v/v /usr/local/bin/vc

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v${{ env.MDBOOK_VERSION }}/mdbook-v${{ env.MDBOOK_VERSION }}-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress ./src
          fail: true

      - name: Spellcheck
        uses: streetsidesoftware/cspell-action@v6
        with:
          files: "src/**/*.md"
          config: ".cspell.json"

      - name: Validate book structure
        run: |
          v run tools/validate.vsh

  build:
    name: Build All Locales
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v${{ env.MDBOOK_VERSION }}/mdbook-v${{ env.MDBOOK_VERSION }}-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin

      - name: Build English
        run: mdbook build

      - name: Build translations
        run: |
          for lang in zh hi es fa ar fr bn pt ru ur id de ja tr ko; do
            if [ -d "translations/$lang" ]; then
              echo "Building $lang..."
              cd translations/$lang
              mdbook build
              cd ../..
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: book/
